<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Now Contact Us | Halcyon Counselling in Surrey</title>

  <meta name="description" content="Book now for counselling services Halcyon Counselling in Surrey.">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #d7fcee;
      color: #333;
      margin: 0;
      padding: 0;
    }

    h1, h2, h3, h4, h5, h6,
    .btn {
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      color: #000;
    }

    /* CTA Section */
    .cta-section {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .cta-buttons-left {
      display: flex;
      gap: 15px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .cta-buttons-left .btn {
      padding: 12px 24px;
      font-size: 1.2em;
      border-radius: 20px;
      background: #275340;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s;
      color: #fff;
      font-family: 'EB Garamond', serif;
      font-weight: 400;
    }

    .book-btn {
      background: #275340;
    }

    .book-btn:hover {
      background: #1d3d2c;
    }

    .contact-btn {
      background: #0a9396;
    }

    .contact-btn:hover {
      background: #007f87;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      border-radius: 8px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5em;
      cursor: pointer;
      color: #333;
    }

    .modal h2 {
      text-align: center;
      margin-bottom: 20px;
      font-family: 'EB Garamond', serif;
      font-weight: 400;
      color: #000;
    }

    form label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 600;
      text-align: left;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: 'Roboto', sans-serif;
      font-size: 1em;
    }

    form textarea {
      resize: vertical;
    }

    form button {
      margin-top: 20px;
      padding: 8px 18px;
      background: #275340;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.05em;
      cursor: pointer;
      transition: background .3s;
      font-family: 'EB Garamond', serif;
      font-weight: 400;
    }

    form button:hover {
      background: #007f87;
    }

    .thankyou {
      text-align: center;
      font-size: 1.2em;
      color: #256029;
      padding: 20px;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .cta-buttons-left {
        flex-direction: column;
        align-items: flex-start;
      }

      .cta-buttons-left .btn {
        width: 100%;
        max-width: 280px;
      }

      .modal-content {
        max-width: 90%;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Call to Action Section -->
  <section class="cta-section">
    <div class="cta-buttons-left">
      <a href="https://halcyoncounselling.com/fees" class="btn book-btn">Book Now</a>
      <a href="#contactModal" class="btn contact-btn" onclick="openContactModal()">Contact Us</a>
    </div>
  </section>

  <!-- Contact Modal -->
  <div id="contactModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeContactModal()">&times;</span>
      <h2>Contact Us</h2>
      <div id="contactFormContainer">
        <form id="contactForm">
          <label>Your Name</label>
          <input type="text" name="name" required>

          <label>Your Email</label>
          <input type="email" name="_replyto" required>

          <label>Message</label>
          <textarea name="message" rows="4" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function openContactModal() {
      document.getElementById('contactModal').style.display = 'flex';
    }

    function closeContactModal() {
      document.getElementById('contactModal').style.display = 'none';
      document.getElementById('contactFormContainer').innerHTML = document.getElementById('originalContactForm').innerHTML;
      attachContactFormHandler();
    }

    // Reset if user clicks outside modal
    window.onclick = function(e) {
      const modal = document.getElementById('contactModal');
      if (e.target === modal) closeContactModal();
    }

    // Store original form for reset
    document.addEventListener("DOMContentLoaded", () => {
      const formHTML = document.getElementById('contactFormContainer').innerHTML;
      const hiddenDiv = document.createElement("div");
      hiddenDiv.id = "originalContactForm";
      hiddenDiv.style.display = "none";
      hiddenDiv.innerHTML = formHTML;
      document.body.appendChild(hiddenDiv);
      attachContactFormHandler();
    });

    // Attach AJAX handler for Formspree
    function attachContactFormHandler() {
      const form = document.getElementById("contactForm");
      if (!form) return;
      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        const data = new FormData(form);
        const response = await fetch("https://formspree.io/f/xanpyqzq", { 
          method: "POST",
          body: data,
          headers: { "Accept": "application/json" }
        });
        if (response.ok) {
          document.getElementById("contactFormContainer").innerHTML = "<div class='thankyou'>✅ Thank you! Your message has been sent.</div>";
        } else {
          document.getElementById("contactFormContainer").innerHTML = "<div class='thankyou' style='color:#a10000;'>❌ Sorry, something went wrong. Please email us directly at julie@halcyoncounselling.com.</div>";
        }
      });
    }
  </script>
</body>
</html>
